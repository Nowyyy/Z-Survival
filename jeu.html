<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <!-- Essai « Sur l'écran d'accueil » (lot 3a) : le jeu lancé depuis l'icône s'affiche sans les barres du navigateur ; ni manifeste, ni service worker, ni image. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050505">
  <title>Z-Survival · Jeu</title>
  <link rel="icon" href="data:,">
  <!-- La table d'import doit précéder tout préchargement de module : Firefox l'ignore sinon (« three » non remappé). -->
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
  <link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/i18n/fr.json" as="fetch" crossorigin>
  <link rel="modulepreload" href="js/game/texts.js">
  <link rel="modulepreload" href="vendor/three/three.module.js">
  <link rel="modulepreload" href="vendor/three/three.core.js">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <script>
    // Si le chargement échoue (script introuvable, erreur au démarrage), le dire à l'écran au lieu de rester à 0 %.
    (function () {
      function fail(detail) {
        var box = document.getElementById('loading');
        if (!box || box.hidden) return;
        document.getElementById('loading-error').hidden = false;
        var d = document.getElementById('loading-detail');
        d.hidden = false;
        d.textContent = String(detail).slice(0, 300);
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') fail('Script introuvable : ' + t.src);
        else if (e.message) fail(e.message);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        fail(e.reason && e.reason.message ? e.reason.message : e.reason);
      });
    })();
  </script>
  <script type="module" src="js/game/boot.js"></script>
  <script type="module" src="js/game/main.js"></script>
</head>
<body class="game">
  <noscript>
    <p class="noscript">Ce jeu a besoin de JavaScript. / This game needs JavaScript.</p>
  </noscript>
  <svg id="boot" class="boot" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    <circle cx="32" cy="32" r="22" class="boot-ring"/>
    <circle cx="32" cy="32" r="8" class="boot-core"/>
  </svg>
  <div id="loading" class="loading" role="status" aria-live="polite">
    <p id="loading-text" class="loading-text"></p>
    <p id="loading-error" class="loading-error" role="alert" data-i18n="game.loading.error" hidden></p>
    <p id="loading-detail" class="loading-detail" hidden></p>
    <div class="loading-bar" aria-hidden="true"><div id="loading-fill" class="loading-fill"></div></div>
  </div>
  <div id="game-root" class="game-root" data-block="E2-1" role="application" data-i18n-label="game.aria" hidden>
    <div id="game-canvas" class="game-canvas"></div>
    <div id="vhs" class="vhs" aria-hidden="true">
      <div class="vhs-static"></div>
      <div class="vhs-grain"></div>
      <div class="vhs-track"></div>
    </div>
    <div id="hud" class="hud" data-block="E2-2">
      <div class="hud-life-row">
        <svg class="hud-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 14.5 1.8 8.3A3.6 3.6 0 0 1 8 3.9a3.6 3.6 0 0 1 6.2 4.4Z"/></svg>
        <div id="hud-bar" class="hud-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" data-i18n-label="game.hud.lifeLabel">
          <div id="hud-fill" class="hud-fill"></div>
          <span id="hud-life" class="hud-bar-text"></span>
        </div>
        <p id="hud-chutes" class="hud-chip"><span id="hud-chutes-icons" class="hud-chutes-icons" aria-hidden="true"></span><span id="hud-chutes-text"></span></p>
      </div>
      <div class="hud-chips">
        <p id="hud-wave" class="hud-wave" hidden></p>
        <p id="hud-remaining" class="hud-chip" hidden></p>
        <p id="hud-next" class="hud-chip" hidden></p>
        <p id="hud-kills" class="hud-chip"></p>
      </div>
    </div>
    <div id="wave-announce" class="wave-announce" data-block="E2-8" aria-hidden="true">
      <div class="wave-announce-veil"></div>
      <div class="wave-announce-body">
        <div class="wave-announce-head">
          <p id="wave-announce-title" class="wave-announce-title"></p>
          <span class="wave-announce-tear" data-tear="1"></span>
          <span class="wave-announce-tear" data-tear="2"></span>
        </div>
        <p id="wave-announce-sub" class="wave-announce-sub" hidden></p>
      </div>
    </div>
    <div id="down" class="down" data-block="E2-10" aria-hidden="true" hidden>
      <div class="down-veil"></div>
      <div class="down-body">
        <p id="down-title" class="down-title"></p>
        <p id="down-sub" class="down-sub"></p>
      </div>
    </div>
    <div id="labels" class="map-labels" aria-hidden="true" hidden></div>
    <div id="edges" class="edges" data-block="E2-11" aria-hidden="true">
      <div class="edge-arrow" data-slot="0" hidden><svg class="edge-pointer" viewBox="0 0 40 40" focusable="false"><path d="M27 12 38 20 27 28Z"/></svg><span class="edge-letter"></span></div>
      <div class="edge-arrow" data-slot="1" hidden><svg class="edge-pointer" viewBox="0 0 40 40" focusable="false"><path d="M27 12 38 20 27 28Z"/></svg><span class="edge-letter"></span></div>
    </div>
    <button id="btn-pause" class="button pause-button" data-block="E2-5" type="button" data-i18n="game.pause.open"></button>
    <div id="stick-left" class="stick" data-block="E2-3" aria-hidden="true" hidden>
      <div class="stick-base"></div>
      <div class="stick-knob"></div>
    </div>
    <div id="stick-right" class="stick" data-block="E2-4" aria-hidden="true" hidden>
      <div class="stick-base"></div>
      <div class="stick-knob"></div>
    </div>
    <button id="sound-hint" class="button sound-hint" type="button" data-i18n="game.sound.hint" hidden></button>
    <p id="hud-live" class="sr-only" aria-live="polite"></p>
  </div>
  <p id="game-error" class="game-error" role="alert" hidden></p>
  <div id="pause-panel" class="panel-wrap" data-block="E2-6" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="panel">
      <h2 id="pause-title" class="panel-title" data-i18n="game.pause.title"></h2>
      <button id="btn-resume" class="button" type="button" data-i18n="game.pause.resume"></button>
      <button id="btn-fullscreen" class="button button-quiet" type="button" data-i18n="game.pause.fullscreen" hidden></button>
      <button id="btn-sound" class="button button-quiet" type="button" hidden></button>
      <button id="btn-vhs" class="button button-quiet" type="button" aria-pressed="true"></button>
      <div id="volume-row" class="volume" hidden>
        <label id="volume-label" for="volume" data-i18n="game.volume"></label>
        <input id="volume" class="volume-range" type="range" min="0" max="100" step="10" value="100">
        <output id="volume-value" class="volume-value" for="volume"></output>
      </div>
      <button id="btn-restart" class="button button-quiet" type="button" data-i18n="game.pause.restart"></button>
    </div>
  </div>
  <div id="end-panel" class="panel-wrap" data-block="E2-7" role="alertdialog" aria-modal="true" aria-labelledby="end-title" hidden>
    <div class="panel">
      <h2 id="end-title" class="panel-title" data-i18n="game.end.title"></h2>
      <p id="end-kills" class="panel-text"></p>
      <p id="end-wave" class="panel-text" hidden></p>
      <p class="panel-note" data-i18n="game.end.provisional"></p>
      <button id="btn-replay" class="button" type="button" data-i18n="game.end.replay"></button>
    </div>
  </div>
  <div id="rotate" class="rotate" role="status" hidden>
    <p class="rotate-title" data-i18n="game.rotate.title"></p>
    <p data-i18n="game.rotate.hint"></p>
  </div>
</body>
</html>
