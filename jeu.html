  <!-- Lot 8g (retour du propriétaire : « une fraction de seconde une barre de chargement avant Toucher pour commencer ») : l'écran de préparation de la
       partie (#loading, #boot) reste invisible tant que le module de démarrage n'a pas choisi : partie directe, il le montre ; mode menu, il reste caché
       (écran de chargement du menu, ou introduction du studio). Une erreur de chargement le montre aussi (message ci-dessous). -->
  <style>.zs-attente #boot, .zs-attente #loading { visibility: hidden; }</style>
  <script>
    document.documentElement.classList.add('zs-attente');
    // Si le chargement échoue (script introuvable, erreur au démarrage), le dire à l'écran au lieu de rester à 0 %.
    (function () {
      function fail(detail) {
        var box = document.getElementById('loading');
        if (!box || box.hidden) return;
        if (!document.documentElement.classList.contains('zs-mode-menu')) document.documentElement.classList.remove('zs-attente');
        document.getElementById('loading-error').hidden = false;
        var d = document.getElementById('loading-detail');
        d.hidden = false;
        d.textContent = String(detail).slice(0, 300);
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') fail('Script introuvable : ' + t.src);
        else if (e.message) fail(e.message);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        fail(e.reason && e.reason.message ? e.reason.message : e.reason);
      });
    })();
  </script>
  <!-- Lot 8a : démarrage (Docs/ref/menu-principal.md) : en partie directe, ce module importe js/game/main.js (avant : balise ici) et précharge
       Three.js (avant : balises modulepreload ici) ; en mode menu, seul le menu se charge, le jeu seulement après « JOUER ». Avant boot.js. -->
  <script type="module" src="js/menu/demarrage.js"></script>

    <button id="btn-pause" class="pause-button" data-block="E2-5" type="button" data-i18n-label="game.pause.open"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z"/></svg></button>
    <div id="stick-left" class="stick" data-block="E2-3" aria-hidden="true" hidden>
      <div class="stick-base"></div>
      <div class="stick-knob"></div>
    </div>
    <div id="stick-right" class="stick" data-block="E2-4" aria-hidden="true" hidden>
      <div class="stick-base"></div>
      <div class="stick-knob"></div>
    </div>
    <button id="sound-hint" class="button sound-hint" type="button" data-i18n="game.sound.hint" hidden></button>
    <p id="hud-live" class="sr-only" aria-live="polite"></p>
  </div>
  <p id="game-error" class="game-error" role="alert" hidden></p>
  <!-- Pause (E2-6) et fin (E2-7), lot 3l, direction B : cadre angulaire, titre en Rubik Dirt ; boutons de 44 px, angles droits. Retours du propriétaire : solde à côté
       de « PAUSE », ni « Prochaine zone », ni état de la sauvegarde, ni volume ; « Quitter » désactivé ; fin sur deux colonnes, sans la note « provisoire ».
       Lot 5j-F (retour du propriétaire) : le son est une icône en haut à droite (#btn-sound : haut-parleur, barré d'une croix quand le son est coupé ;
       nom accessible « Son : activé » ou « Son : coupé ») ; la croix de fermeture du lot 5j-E est retirée (« Reprendre » suffit).
       Lot 5j-G : Plein écran devient une icône à gauche de celle du son (#btn-fullscreen, masquée sans l'API, ex. iPhone) ; 2 × 2 boutons, Quitter sous Options.
       Lot 5j : « Options » (sous Son) ouvre l'écran Options (E2-12, construit par js/game/options-menu.js à la première ouverture) ; « Graphismes » et
       « Effet VHS » y sont passés.
       Lot 5l : icône « Débogage » (#btn-debug, insecte) juste à gauche de celle du son (le son reste en haut à droite, dernier élément de la tête), même forme (44 × 44 px), visible seulement sur les canaux de débogage
       (source, dev, release : balise zs-canal) ; elle ouvre le menu de débogage (E2-13, construit par js/game/debug-menu.js au premier clic).
       Lot 8a : « Quitter » actif (confirmation construite par js/game/ui.js) et « Revenir au menu principal » actif : retour au menu principal. -->
  <div id="pause-panel" class="panel-wrap" data-block="E2-6" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="panel panel-pause">
      <div class="panel-head">
        <h2 id="pause-title" class="panel-title" data-i18n="game.pause.title"></h2>
        <p id="pause-balance" class="panel-line"><span id="pause-balance-text"></span><svg class="hud-icon hud-coin" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.2v7.6M5.6 6.2h3.7a1.2 1.2 0 0 1 0 2.4H6.7a1.2 1.2 0 0 0 0 2.4h3.7"/></svg></p>
        <button id="btn-fullscreen" class="button button-quiet panel-icon panel-fullscreen" type="button" data-i18n-label="game.pause.fullscreen" data-active="false" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path class="fs-enter" d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/><path class="fs-exit" d="M6 2.5V6H2.5M10 2.5V6h3.5M13.5 10H10v3.5M6 13.5V10H2.5"/></svg></button>
        <button id="btn-debug" class="button button-quiet panel-icon panel-debug" type="button" data-i18n-label="game.debug.open" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5.5 7h5v3.5a2.5 2.5 0 0 1-5 0zM6.5 7V5.5a1.5 1.5 0 0 1 3 0V7M1.5 9h4M10.5 9h4M2.5 5.5l3 1.5M13.5 5.5l-3 1.5M2.5 13.5l3-2M13.5 13.5l-3-2"/></svg></button>
        <button id="btn-sound" class="button button-quiet panel-icon panel-sound" type="button" data-muted="false" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path class="sound-body" d="M2 6h2.6L8.4 3v10L4.6 10H2z"/><path class="sound-waves" d="M10.6 5.6a3.2 3.2 0 0 1 0 4.8M12.6 3.6a6 6 0 0 1 0 8.8"/><path class="sound-off" d="M10.4 5.6l4.4 4.8M14.8 5.6l-4.4 4.8"/></svg></button>
      </div>
      <div class="panel-actions">
        <button id="btn-resume" class="button button-main" type="button" data-i18n="game.pause.resume"></button>
        <button id="btn-restart" class="button button-quiet" type="button" data-i18n="game.pause.restart"></button>
        <button id="btn-options" class="button button-quiet" type="button" data-i18n="game.pause.options"></button>
        <button id="btn-quit" class="button button-quiet" type="button" data-i18n="game.pause.quit"></button>
      </div>
    </div>
  </div>
  <div id="end-panel" class="panel-wrap" data-block="E2-7" role="alertdialog" aria-modal="true" aria-labelledby="end-title" hidden>
    <div id="end-box" class="panel panel-end" data-variant="death">
      <h2 id="end-title" class="panel-title"><svg class="hud-icon end-icon end-icon-death" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 1.5c3.3 0 5.5 2.3 5.5 5.2 0 1.8-.9 3-2 3.7V13H4.5v-2.6c-1.1-.7-2-1.9-2-3.7C2.5 3.8 4.7 1.5 8 1.5Zm-2.3 5a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Zm4.6 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Z"/></svg><svg class="hud-icon end-icon end-icon-world" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m2 8.5 1.6-1.6 2.9 2.9 6-6L14 5.4l-7.5 7.5Z"/></svg><span id="end-title-text" data-i18n="game.end.title"></span></h2>
      <div class="panel-facts">
        <div class="facts-col">
          <p id="end-wave" class="panel-line" hidden></p>
          <p id="end-record" class="panel-line end-record" hidden><svg class="hud-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m8 1.3 2 4.3 4.7.5-3.5 3.2 1 4.6L8 11.5l-4.2 2.4 1-4.6L1.3 6.1 6 5.6Z"/></svg><span id="end-record-text"></span></p>
          <p id="end-best" class="panel-line"></p>
        </div>
        <div class="facts-col">
          <p id="end-kills" class="panel-line"></p>
          <p id="end-earned" class="panel-line"><span id="end-earned-text"></span><svg class="hud-icon hud-coin" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.2v7.6M5.6 6.2h3.7a1.2 1.2 0 0 1 0 2.4H6.7a1.2 1.2 0 0 0 0 2.4h3.7"/></svg></p>
          <p id="end-bonus" class="panel-line end-bleu" hidden><span id="end-bonus-text"></span><svg class="hud-icon hud-gem" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 1.6 14 6.4 8 14.4 2 6.4Z"/><path d="M2 6.4h12M5.6 6.4 8 14.4l2.4-8"/></svg></p>
          <p id="end-bleu" class="panel-line end-bleu"><span id="end-bleu-text"></span><svg class="hud-icon hud-gem" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 1.6 14 6.4 8 14.4 2 6.4Z"/><path d="M2 6.4h12M5.6 6.4 8 14.4l2.4-8"/></svg></p>
          <p id="end-balance" class="panel-line end-bleu"><span id="end-balance-text"></span><svg class="hud-icon hud-gem" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 1.6 14 6.4 8 14.4 2 6.4Z"/><path d="M2 6.4h12M5.6 6.4 8 14.4l2.4-8"/></svg></p>
        </div>
        <p id="end-save" class="panel-note" hidden></p>
      </div>
      <div class="panel-actions">
        <button id="btn-replay" class="button button-main" type="button" data-i18n="game.end.replay"></button>
        <button id="btn-menu" class="button button-quiet" type="button" data-i18n="game.end.menu"></button>
      </div>
    </div>
  </div>
  <div id="rotate" class="rotate" role="status" hidden>
    <p class="rotate-title" data-i18n="game.rotate.title"></p>
    <p data-i18n="game.rotate.hint"></p>
  </div>
</body>
</html>
