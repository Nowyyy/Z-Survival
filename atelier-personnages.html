<!doctype html>

<body class="persos-page">

  <main id="app" class="persos" hidden>
    <header class="persos-head" aria-labelledby="persos-title">
      <h1 id="persos-title" class="persos-title" data-i18n="dev.persos.title">Atelier des personnages</h1>
      <p class="persos-intro" data-i18n="dev.persos.intro"></p>
      <p class="persos-warning" data-i18n="dev.persos.warning"></p>
      <p id="status" class="persos-status" role="status" aria-live="polite"></p>
      <p id="webgl-error" class="persos-error" data-i18n="dev.persos.webgl" hidden></p>
      <nav class="persos-nav" aria-labelledby="nav-title">
        <h2 id="nav-title" class="persos-nav-title" data-i18n="dev.persos.nav"></h2>
        <ul class="persos-nav-list">
          <li><a class="persos-link" href="#section-epoque" data-i18n="dev.epoque.nav"></a></li>
          <li><a class="persos-link" href="#section-choix" data-i18n="dev.persos.choose"></a></li>

        </ul>
      </nav>

    <section id="section-epoque" class="persos-section" aria-labelledby="epoque-title">
      <h2 id="epoque-title" class="persos-heading" data-i18n="dev.epoque.title"></h2>
      <p class="persos-note" data-i18n="dev.epoque.intro"></p>
      <p class="persos-warning" data-i18n="dev.epoque.warning"></p>
      <p id="ep-webgl" class="persos-error" data-i18n="dev.epoque.webgl" hidden></p>
      <div class="persos-controls">
        <div class="persos-field"><label for="ep-perso" data-i18n="dev.epoque.perso"></label><select id="ep-perso" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-lettre" data-i18n="dev.epoque.lettre"></label><select id="ep-lettre" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-tenue" data-i18n="dev.epoque.tenue"></label><select id="ep-tenue" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-niveau" data-i18n="dev.epoque.niveau"></label><select id="ep-niveau" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-anim" data-i18n="dev.epoque.anim"></label><select id="ep-anim" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-arme" data-i18n="dev.epoque.arme"></label><select id="ep-arme" class="persos-select"></select></div>

        <div class="persos-field"><label for="ep-usure" data-i18n="dev.epoque.usure"></label><select id="ep-usure" class="persos-select"></select></div>
        <button id="ep-play" class="button persos-button" type="button" aria-pressed="false"></button>
      </div>
      <p id="ep-intent" class="persos-note"></p>
      <h3 class="persos-subheading" data-i18n="dev.epoque.gros"></h3>
      <div class="persos-stage ep-stage-gros"><canvas id="ep-canvas-gros" class="persos-canvas ep-canvas" width="480" height="480" aria-hidden="true"></canvas></div>
      <h3 id="ep-h-jeu" class="persos-subheading" data-i18n="dev.epoque.jeu"></h3>
      <div class="ep-reel" tabindex="0" role="region" aria-labelledby="ep-h-jeu"><canvas id="ep-canvas-jeu" class="ep-canvas-reel" width="667" height="375" aria-hidden="true"></canvas></div>
      <p id="ep-jeu-legende" class="persos-legend"></p>
      <h3 id="ep-h-zoom3" class="persos-subheading" data-i18n="dev.epoque.zoom3"></h3>
      <div class="ep-reel" tabindex="0" role="region" aria-labelledby="ep-h-zoom3"><canvas id="ep-canvas-zoom3" class="ep-canvas-reel" width="667" height="375" aria-hidden="true"></canvas></div>
      <h3 id="ep-h-tenues" class="persos-subheading" data-i18n="dev.epoque.tenues"></h3>
      <div class="ep-reel" tabindex="0" role="region" aria-labelledby="ep-h-tenues"><canvas id="ep-canvas-tenues" class="ep-canvas-reel" width="667" height="375" aria-hidden="true"></canvas></div>
      <h3 id="ep-h-horde" class="persos-subheading" data-i18n="dev.epoque.horde"></h3>
      <div class="persos-controls">
        <div class="persos-field"><label for="ep-horde-lettre" data-i18n="dev.epoque.horde.choix"></label><select id="ep-horde-lettre" class="persos-select"></select></div>
      </div>
      <div class="ep-reel" tabindex="0" role="region" aria-labelledby="ep-h-horde"><canvas id="ep-canvas-horde" class="ep-canvas-reel" width="667" height="375" aria-hidden="true"></canvas></div>
      <h3 id="ep-h-hd" class="persos-subheading" data-i18n="dev.epoque.hd"></h3>

      <h3 class="persos-subheading" data-i18n="dev.epoque.budgets"></h3>
      <p class="persos-note" data-i18n="dev.epoque.budgets.intro"></p>
      <div class="ep-table-boite" tabindex="0" role="region" aria-labelledby="ep-budgets-titre">
        <table class="ep-table">
          <caption id="ep-budgets-titre" data-i18n="dev.epoque.budgets"></caption>
          <thead><tr><th scope="col" data-i18n="dev.epoque.budget.perso"></th><th scope="col" data-i18n="dev.epoque.budget.actuelle"></th><th scope="col">A</th><th scope="col">B</th><th scope="col">C</th></tr></thead>
          <tbody id="ep-budgets"></tbody>
        </table>
      </div>
      <h3 class="persos-subheading" data-i18n="dev.epoque.choix"></h3>
      <p class="persos-note" data-i18n="dev.epoque.choix.intro"></p>
      <div class="persos-controls">
        <div class="persos-field"><label for="ep-choix-survivant" data-i18n="dev.epoque.perso.survivant"></label><select id="ep-choix-survivant" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-choix-personnage-2" data-i18n="dev.epoque.perso.personnage-2"></label><select id="ep-choix-personnage-2" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-choix-marcheur" data-i18n="dev.epoque.perso.marcheur"></label><select id="ep-choix-marcheur" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-choix-petit" data-i18n="dev.epoque.perso.petit"></label><select id="ep-choix-petit" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-choix-voute" data-i18n="dev.epoque.perso.voute"></label><select id="ep-choix-voute" class="persos-select"></select></div>
        <div class="persos-field"><label for="ep-choix-grand" data-i18n="dev.epoque.perso.grand"></label><select id="ep-choix-grand" class="persos-select"></select></div>
      </div>
      <label class="persos-choices-label" for="ep-choix-texte" data-i18n="dev.epoque.choix.label"></label>
      <textarea id="ep-choix-texte" class="persos-choices" rows="12" readonly spellcheck="false"></textarea>
      <button id="ep-copier" class="button persos-button" type="button" data-i18n="dev.epoque.copier"></button>
      <p id="ep-copie" class="persos-note" role="status" aria-live="polite"></p>
    </section>

    <div class="persos-suite">
      <div id="persos-reglages" class="persos-reglages" role="region" aria-labelledby="choix-title">

        <div class="persos-controls persos-reglages-liste">
          <div class="persos-field"><label for="ctl-perso" data-i18n="dev.persos.perso"></label><select id="ctl-perso" class="persos-select"></select></div>
          <div class="persos-field"><label for="ctl-variante" data-i18n="dev.persos.variante"></label><select id="ctl-variante" class="persos-select"></select></div>
          <div class="persos-field"><label for="ctl-tenue" data-i18n="dev.persos.tenue"></label><select id="ctl-tenue" class="persos-select"></select></div>
          <div class="persos-field"><label for="ctl-usure" data-i18n="dev.persos.usure"></label><select id="ctl-usure" class="persos-select"></select></div>
          <div class="persos-field persos-field-range"><label for="ctl-manche" data-i18n="dev.persos.manche"></label><input id="ctl-manche" class="persos-range" type="range" min="1" max="40" step="1" value="1"><output id="out-manche" class="persos-value" for="ctl-manche">1</output></div>
          <div class="persos-field"><label for="ctl-anim" data-i18n="dev.persos.anim"></label><select id="ctl-anim" class="persos-select"></select></div>
          <div class="persos-field"><label for="ctl-sol" data-i18n="dev.persos.sol"></label><select id="ctl-sol" class="persos-select"></select></div>
          <div class="persos-field"><label for="ctl-vue" data-i18n="dev.persos.vue"></label><select id="ctl-vue" class="persos-select"></select></div>
          <div class="persos-field persos-field-range"><label for="ctl-orbite" data-i18n="dev.persos.orbite"></label><input id="ctl-orbite" class="persos-range" type="range" min="-60" max="60" step="5" value="0"><output id="out-orbite" class="persos-value" for="ctl-orbite">0°</output></div>
          <div class="persos-field"><label for="ctl-vitesse" data-i18n="dev.persos.vitesse"></label><select id="ctl-vitesse" class="persos-select"></select></div>
          <button id="btn-play" class="button persos-button" type="button" aria-pressed="true" data-i18n="dev.persos.pause"></button>
        </div>
      </div>

    <section id="section-choix" class="persos-section" aria-labelledby="main-title">
      <h2 id="main-title" class="persos-heading" data-i18n="dev.persos.main"></h2>
      <p class="persos-note" data-i18n="dev.persos.choose.intro"></p>
      <div class="persos-stage persos-stage-main"><canvas id="canvas-main" class="persos-canvas" width="667" height="375" aria-hidden="true"></canvas></div>
    </section>

    <section id="section-comparaison" class="persos-section" aria-labelledby="comparaison-title">
      <h2 id="comparaison-title" class="persos-heading" data-i18n="dev.persos.compare"></h2>
      <p class="persos-note" data-i18n="dev.persos.compare.intro"></p>
      <div class="persos-stage persos-stage-grid"><canvas id="canvas-grid" class="persos-canvas" width="640" height="480" aria-hidden="true"></canvas></div>
      <p id="grid-legend" class="persos-legend"></p>
    </section>



    <section id="section-sang" class="persos-section" aria-labelledby="sang-title">
      <h2 id="sang-title" class="persos-heading" data-i18n="dev.persos.blood"></h2>
      <p class="persos-note" data-i18n="dev.persos.blood.intro"></p>
      <div class="persos-controls">
        <div class="persos-field"><label for="ctl-sang" data-i18n="dev.persos.blood.level"></label><select id="ctl-sang" class="persos-select"></select></div>
        <button id="btn-hit" class="button persos-button" type="button" data-i18n="dev.persos.blood.hit"></button>
        <button id="btn-kill" class="button persos-button" type="button" data-i18n="dev.persos.blood.kill"></button>
        <button id="btn-burst" class="button persos-button" type="button" data-i18n="dev.persos.blood.burst"></button>
      </div>
      <p id="blood-stats" class="persos-legend" role="status" aria-live="polite"></p>
    </section>


    <section id="section-mes-choix" class="persos-section" aria-labelledby="mes-choix-title">
      <h2 id="mes-choix-title" class="persos-heading" data-i18n="dev.persos.choices"></h2>
      <p class="persos-note" data-i18n="dev.persos.choices.intro"></p>
      <button id="btn-pick" class="button persos-button" type="button" data-i18n="dev.persos.choices.pick"></button>
      <label class="persos-choices-label" for="choices-text" data-i18n="dev.persos.choices.label"></label>
      <textarea id="choices-text" class="persos-choices" rows="7" readonly spellcheck="false"></textarea>
      <button id="btn-copy" class="button persos-button" type="button" data-i18n="dev.persos.copy"></button>
      <p id="copy-status" class="persos-note" role="status" aria-live="polite"></p>
    </section>
