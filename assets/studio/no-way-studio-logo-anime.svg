<svg xmlns="http://www.w3.org/2000/svg" viewBox="-44 -84 792 556" role="img" aria-label="No Way Studio" xmlns:c2pa="http://c2pa.org/manifest"><style>
.ltr,.slam{transform-box:fill-box;transform-origin:center}
