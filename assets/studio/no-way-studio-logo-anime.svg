@keyframes nw-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes nw-fade{from{opacity:0}to{opacity:1}}
@keyframes nw-slam{0%{opacity:0;transform:scale(3.2)}25%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes nw-tilt{0%{transform:rotate(0)}30%{transform:rotate(-7deg)}55%{transform:rotate(-2.6deg)}78%{transform:rotate(-4.7deg)}100%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tilt{transform:rotate(-4deg)}}
