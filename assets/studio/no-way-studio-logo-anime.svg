<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -62 824 628" role="img" aria-label="No Way Studio" xmlns:c2pa="http://c2pa.org/manifest"><style>
.ltr,.slam,.ring{transform-box:fill-box;transform-origin:center}
.drop{animation:nw-drop .55s cubic-bezier(.3,.7,.4,1) both}
.ltr{animation:nw-neon .7s linear both}
.d1{animation-delay:.60s}.d2{animation-delay:.78s}.la{animation-delay:.96s}.d3{animation-delay:1.14s}
.wipe{animation:nw-wipe .35s ease-out 1.40s both}
.fade{animation:nw-fade .3s ease-out both}
.f1{animation-delay:1.62s}.f2{animation-delay:1.72s}
.slam{animation:nw-slam .18s cubic-bezier(.7,0,1,.5) 2.10s both,nw-squash .3s ease-out 2.28s forwards}
.flash{opacity:0;animation:nw-flash .22s ease-out 2.28s forwards}
.ring{opacity:0;animation:nw-ring .5s cubic-bezier(.1,.7,.3,1) 2.28s forwards}
.shake{animation:nw-shake .34s linear 2.28s both}
.tilt{animation:nw-tilt 3.4s ease-in-out 2.30s both}
@keyframes nw-drop{0%{opacity:0;transform:translateY(-50px)}60%{opacity:1;transform:translateY(0)}80%{opacity:1;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nw-neon{0%{opacity:0}8%{opacity:1}16%{opacity:0}30%{opacity:1}40%{opacity:.25}55%{opacity:1}66%{opacity:.5}78%{opacity:1}100%{opacity:1}}
@keyframes nw-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes nw-fade{from{opacity:0}to{opacity:1}}
@keyframes nw-slam{0%{opacity:0;transform:scale(5)}20%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes nw-squash{0%{transform:scale(1.22,.8)}40%{transform:scale(.93,1.07)}70%{transform:scale(1.03,.98)}100%{transform:scale(1)}}
@keyframes nw-flash{0%{opacity:.95}100%{opacity:0}}
@keyframes nw-ring{0%{opacity:.9;transform:scale(.8);stroke-width:14}100%{opacity:0;transform:scale(3.3);stroke-width:1}}
@keyframes nw-shake{0%{transform:translate(0,0)}12%{transform:translate(-9px,12px)}30%{transform:translate(7px,-6px)}50%{transform:translate(-5px,5px)}70%{transform:translate(3px,-2px)}100%{transform:translate(0,0)}}
@keyframes nw-tilt{0%{transform:rotate(0)}10%{transform:rotate(-15deg)}23%{transform:rotate(-3deg)}36%{transform:rotate(-15deg)}48%{transform:rotate(-5deg)}60%{transform:rotate(-15deg)}71%{transform:rotate(-6.5deg)}82%{transform:rotate(-15deg)}100%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tilt{transform:rotate(-4deg)}}
</style>
