name: Pages

# Lot 4c : publication par versions. Racine = main (version actuelle), next/ = dev (dernier build de développement), v0.N/ = branche archive
# (versions figées), lots/ = page de renvoi. Seuls main et dev déclenchent ce workflow (plus aucun aperçu par lot, rien sur archive).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Un seul groupe pour tous les déploiements, sans annulation d'un déploiement en cours (un run en attente est remplacé par le plus récent,
# qui reconstruit de toute façon les têtes actuelles de main et de dev).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Rapide (environ 2 minutes) : lint et tests unitaires, à chaque push et à chaque lancement manuel.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Déploiement du site complet depuis main ou dev : les deux branches sont toujours reconstruites ensemble (la courante à son commit, l'autre à sa tête).
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Racine du site : main (au commit du run s'il vient de main, sinon sa tête).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref == 'refs/heads/main' && github.sha || 'main' }}
          path: main
      # Branches facultatives : dev (next/) et archive (v0.N/) n'existent peut-être pas encore.
      - id: refs
        working-directory: main
        run: |
          heads="$(git ls-remote --heads origin dev archive)"
          echo "dev=$(grep -q 'refs/heads/dev$' <<<"$heads" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "archive=$(grep -q 'refs/heads/archive$' <<<"$heads" && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.refs.outputs.dev == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref == 'refs/heads/dev' && github.sha || 'dev' }}
          path: dev
      - if: steps.refs.outputs.archive == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: archive
          path: archive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build de main
        working-directory: main
        run: npm ci && npm run build
      - name: Build de dev
        if: steps.refs.outputs.dev == 'true'
        working-directory: dev
        run: npm ci && npm run build
      # L'assembleur et versions.json sont ceux de main (la version publiée décide de la publication).
      - name: Assemblage du site
        run: >-
          node main/scripts/assemble.mjs --main main/_site --versions main/versions.json --out _site
          ${{ steps.refs.outputs.dev == 'true' && '--dev dev/_site' || '' }}
          ${{ steps.refs.outputs.archive == 'true' && '--archive archive' || '' }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
