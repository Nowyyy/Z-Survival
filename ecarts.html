<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Z-Survival · Atelier de la carte : écarts avec le modèle</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/i18n/fr.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ecarts.css">
  <script type="module" src="js/ecarts/main.js"></script>
</head>
<body class="ecarts-page">
  <noscript>
    <p class="noscript">Cette page dessine les écarts entre la carte et le modèle 3D : elle a besoin de JavaScript. Le même rapport existe en texte dans Docs/ref/ecarts-modele.md (dépôt). <a href="visite.html">Visite libre</a></p>
  </noscript>
  <main id="app" class="ecarts" hidden>
    <h1 class="ecarts-title" data-i18n="dev.ecarts.title"></h1>
    <p class="ecarts-intro" data-i18n="dev.ecarts.intro"></p>
    <nav aria-label="Étage" data-i18n-label="dev.ecarts.nav">
      <ul class="ecarts-nav">
        <li><button id="bouton-rdc" class="ecarts-button" type="button" aria-pressed="true" data-floor="rdc" data-i18n="dev.carte.floor.rdc"></button></li>
        <li><button id="bouton-etage" class="ecarts-button" type="button" aria-pressed="false" data-floor="etage" data-i18n="dev.carte.floor.etage"></button></li>
        <li><a id="lien-visite" class="ecarts-button" href="visite.html" data-i18n="dev.visite.title"></a></li>
      </ul>
    </nav>
    <p id="stats" class="ecarts-stats" role="status" aria-live="polite"></p>
    <figure id="figure" class="ecarts-figure"></figure>
    <ul class="ecarts-legend" aria-label="Légende" data-i18n-label="dev.carte.legend">
      <li><span class="ecarts-swatch sw-carte"></span><span data-i18n="dev.ecarts.legend.carte"></span></li>
      <li><span class="ecarts-swatch sw-modele"></span><span data-i18n="dev.ecarts.legend.modele"></span></li>
      <li><span class="ecarts-swatch sw-objet"></span><span data-i18n="dev.ecarts.legend.objet"></span></li>
      <li><span class="ecarts-swatch sw-ecart"></span><span data-i18n="dev.ecarts.legend.ecart"></span></li>
    </ul>
  </main>
</body>
</html>
